name: Update Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number (e.g., 3.6.0)'
        required: true
        type: string

# Add permissions block
permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Changelog
        id: update_changelog
        run: |
          # Function to extract content between two patterns
          extract_between() {
            awk "/$1/{p=1;next} /$2/{p=0} p" "$3"
          }
          
          # Get the unreleased content
          unreleased_content=$(extract_between "## \[Unreleased\]" "## \[" "changelog.md")
          
          if [ -z "$unreleased_content" ]; then
            echo "No unreleased changes found in changelog.md"
            exit 1
          fi
          
          # Get the current version
          current_version=$(grep -oP "## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])" changelog.md | head -n1)
          new_version="${{ github.event.inputs.version }}"
          
          # Validate version format
          if ! [[ $new_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format. Please use semantic versioning (e.g., 3.6.0)"
            exit 1
          fi
          
          echo "new_version=${new_version}" >> $GITHUB_OUTPUT
          
          # Create temporary file
          temp_file=$(mktemp)
          
          # Write new changelog content
          {
            echo "## [Unreleased]"
            echo ""
            echo "## [$new_version]"
            echo "$unreleased_content"
            tail -n +2 changelog.md
          } > "$temp_file"
          
          # Replace original file
          mv "$temp_file" changelog.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: prepare release ${{ steps.update_changelog.outputs.new_version }}"
          title: "Prepare release ${{ steps.update_changelog.outputs.new_version }}"
          body: |
            Preparing release ${{ steps.update_changelog.outputs.new_version }}
            
            This PR moves changes from the Unreleased section to a new version section in the changelog.
          branch: prepare-release
          delete-branch: true 